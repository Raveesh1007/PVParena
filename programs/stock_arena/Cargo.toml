[package]
name = "stock_arena"
version = "0.1.0"
description = "Stock Arena: two-player PvP market-prediction escrow and settlement"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "stock_arena"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
# `init-if-needed` is required where an account may legitimately exist already or
# not: the loser's quote account and winner's asset account in `exercise_option`
# (winner pays rent), and the second-mint vault in `join_match` (shared with the
# creator's vault in a same-token duel).
anchor-lang = { version = "=0.31.1", features = ["init-if-needed"] }
anchor-spl = "=0.31.1"
pyth-solana-receiver-sdk = "0.6.1"
